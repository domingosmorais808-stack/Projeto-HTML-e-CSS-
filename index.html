<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: #0f0f0f;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      background-color: #1a1a1a;
    }

    .hero {
      height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero h1 {
      font-size: 40px;
    }

    .btn {
      background-color: blue;
      padding: 10px 20px;
      border: none;
      color: white;
      border-radius: 8px;
      margin-top: 10px;
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 40px;
      flex-wrap: wrap;
    }

    .card {
      background-color: #1f1f1f;
      padding: 20px;
      width: 200px;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #1a1a1a;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <div>NgumbeDev</div>
    <div>Menu</div>
  </header>

  <section class="hero">
    <h1>Crio Sites Profissionais 🚀</h1>
    <p>Do celular para o mundo</p>
    <button class="btn">Começar</button>
  </section>

  <section class="cards">
    <div class="card">HTML</div>
    <div class="card">CSS</div>
    <div class="card">JavaScript</div>
  </section>

  <footer>
    © 2026 NgumbeDev
  </footer>

</body>
</html>
